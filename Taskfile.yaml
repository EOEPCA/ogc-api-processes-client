version: '3'

vars:
  OPENAPI_CODEGEN_VERSION: 7.12.0
  PACKAGE_NAME: ogc_api_processes_client

tasks:

  download_ogcapi-processes:
    internal: true
    vars:
      TARGET: .
      API: ogcapi-processes
    status:
    - test -f {{.TARGET}}/{{.API}}.yaml
    cmds:
    - wget https://developer.ogc.org/api/processes/openapi.yaml -O {{.TARGET}}/openapi.yaml
    - redocly bundle ./openapi.yaml --output {{.TARGET}}/{{.API}}.yaml --force

  # API generation

  maven_download:
    internal: true
    status:
    - test -f ./lib/{{.ARTIFACT_ID}}-{{.VERSION}}.jar
    cmds:
    - mkdir -p ./lib
    - wget https://repo1.maven.org/maven2/{{.GROUP_ID}}/{{.ARTIFACT_ID}}/{{.VERSION}}/{{.ARTIFACT_ID}}-{{.VERSION}}.jar -O ./lib/{{.ARTIFACT_ID}}-{{.VERSION}}.jar

  openapi_generator:
    internal: true
    deps:
    - task: maven_download
      vars:
        GROUP_ID: org/openapitools
        ARTIFACT_ID: openapi-generator-cli
        VERSION: "{{.OPENAPI_CODEGEN_VERSION}}"
    vars:
      API_VERSION:
        sh: yq '.info.version' ./{{.API_SPEC}}.yaml
    cmds:
    - |
      java -DmaxYamlCodePoints=99999999 \
           -Dverbose=false \
           -jar ./lib/openapi-generator-cli-{{.OPENAPI_CODEGEN_VERSION}}.jar \
           generate \
           --skip-validate-spec \
           --input-spec ./{{.API_SPEC}}.yaml \
           --generator-name {{.GENERATOR_NAME}} \
           --additional-properties=packageName={{.PACKAGE_NAME}},packageVersion={{.API_VERSION}},projectName={{.API_SPEC}},enablePostProcessFile=false,verbose=false \
           --output {{.TARGET}}

  build:
    internal: true
    desc: Builds the OGC API - Processes Python client.
    deps:
    - task: download_ogcapi-processes
    cmds:
    - task: openapi_generator
      vars:
        API_SPEC: ogc-api
        GENERATOR_NAME: python
        TARGET: .

  post_codegen_fixes:
    internal: true
    desc: Apply deterministic fixes after OpenAPI generation.
    cmds:
    - |
      # pydantic v2 compatibility: generated unions may use `bytearray`, which breaks schema generation.
      rg -l "bytearray" ogc_api_processes_client/models | xargs -r perl -pi -e 's/\bbytearray\b/bytes/g'
    - perl -pi -e 's/elif klass == object:/elif klass is object:/g' ogc_api_processes_client/api_client.py
    - sed -i '/response_obj = next(v for v in response_dict.values())/d' ogc_api_processes_client/api_client_wrapper.py
    - sed -i '/instance = InlineOrRefData\.model_construct()/d' ogc_api_processes_client/models/inline_or_ref_data.py
    - sed -i '/instance = ModelSchema\.model_construct()/d' ogc_api_processes_client/models/model_schema.py
    - sed -i '/instance = SchemaOneOfNot\.model_construct()/d' ogc_api_processes_client/models/schema_one_of_not.py
    - |
      perl -pi -e 's@from ogc_api_processes_client.models.schema_one_of import SchemaOneOf@from ogc_api_processes_client.models.schema_one_of import SchemaOneOf  # noqa: E402@g' \
        ogc_api_processes_client/models/model_schema.py
    - |
      perl -pi -e 's@from ogc_api_processes_client.models.model_schema import ModelSchema@from ogc_api_processes_client.models.model_schema import ModelSchema  # noqa: E402@g' \
        ogc_api_processes_client/models/schema_one_of_additional_properties.py \
        ogc_api_processes_client/models/schema_one_of_not.py
    - |
      perl -0777 -pi -e 's/from ogc_api_processes_client\.models\.schema_one_of_additional_properties import \(\n\s*SchemaOneOfAdditionalProperties,\n\)\nfrom ogc_api_processes_client\.models\.schema_one_of_not import SchemaOneOfNot/from ogc_api_processes_client.models.schema_one_of_additional_properties import SchemaOneOfAdditionalProperties  # noqa: E402\nfrom ogc_api_processes_client.models.schema_one_of_not import SchemaOneOfNot  # noqa: E402/s' \
        ogc_api_processes_client/models/schema_one_of.py
    - |
      perl -pi -e 's@from ogc_api_processes_client.models.schema_one_of_additional_properties import SchemaOneOfAdditionalProperties@from ogc_api_processes_client.models.schema_one_of_additional_properties import SchemaOneOfAdditionalProperties  # noqa: E402@g; s@from ogc_api_processes_client.models.schema_one_of_not import SchemaOneOfNot@from ogc_api_processes_client.models.schema_one_of_not import SchemaOneOfNot  # noqa: E402@g' \
        ogc_api_processes_client/models/schema_one_of.py

  cleanup_generated_files:
    internal: true
    desc: Remove legacy files generated by OpenAPI Generator that are not used in this project.
    cmds:
    - rm -f setup.py setup.cfg tox.ini requirements.txt test-requirements.txt git_push.sh .travis.yml .gitlab-ci.yml README-generated.md
    - find docs -maxdepth 1 -type f -name '*.md' ! -name 'index.md' ! -name 'installation.md' ! -name 'usage.md' ! -name 'developer-onboarding.md' -delete
    - rm -rf docs/client

  build-safe:
    desc: Build client, apply post-generation fixes, then run checks and tests.
    cmds:
    - task: build
    - task: post_codegen_fixes
    - task: cleanup_generated_files
    - task: check
    - task: test

  test:
    desc: Run Python tests with Hatch.
    cmds:
    - HATCH_DATA_DIR=.hatch-data hatch run test:run

  lint:
    desc: Format code with Ruff.
    cmds:
    - HATCH_DATA_DIR=.hatch-data hatch run dev:lint

  check:
    desc: Run Ruff checks with auto-fix.
    cmds:
    - HATCH_DATA_DIR=.hatch-data hatch run dev:check

  docs-serve:
    desc: Serve documentation locally with MkDocs via uv.
    cmds:
    - uv run --with mkdocs-material --with mkdocs-mermaid2-plugin --with mkdocs-jupyter --with legacy-cgi --with pdocs mkdocs serve

  docs-build:
    desc: Build documentation locally with MkDocs via uv.
    cmds:
    - uv run --with mkdocs-material --with mkdocs-mermaid2-plugin --with mkdocs-jupyter --with legacy-cgi --with pdocs mkdocs build
